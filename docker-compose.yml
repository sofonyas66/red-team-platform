  #   #         - driver: nvidia
  #   #           count: 1
  #           capabilities: [gpu]

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  qdrant_data:
  # ollama_data:

networks:
  default:
    name: ${PROJECT_NAME:-red-team-platform}-network