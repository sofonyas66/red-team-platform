services:
  neo4j:
    image: neo4j:latest
    container_name: ${PROJECT_NAME:-red-team-platform}-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2g
      NEO4J_dbms_memory_pagecache_size: 1g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-changeme}", "RETURN 1"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 45s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ${PROJECT_NAME:-red-team-platform}-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ${PROJECT_NAME:-red-team-platform}-ollama
  #   ports:
  #     - "${OLLAMA_PORT:-11434}:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped
  #   # Uncomment this service + set LLM_PROVIDER=ollama in .env
  #   # to run fully offline once on appropriate hardware
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #           capabilities: [gpu]

  postgres:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME:-red-team-platform}-postgres
    environment:
      POSTGRES_USER: rtap
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: rtap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  qdrant_data:
  postgres_data:
  # ollama_data:

networks:
  default:
    name: ${PROJECT_NAME:-red-team-platform}-network