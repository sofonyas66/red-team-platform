
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENV=development
      - DATABASE_URL=postgresql://rtap:changeme@postgres:5432/rtap
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - postgres
      - neo4j

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=rtap
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=rtap
    ports:
      - "5432:5432"

  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/changeme
    ports:
      - "7474:7474"
      - "7687:7687"
