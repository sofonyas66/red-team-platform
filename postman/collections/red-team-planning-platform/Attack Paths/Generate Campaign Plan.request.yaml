$kind: http-request
name: Generate Campaign Plan
method: POST
url: '{{baseUrl}}/plan/generate'
order: 2000
description: |-
  Generate an LLM-powered red team campaign plan for a given source-to-target attack path. Requires admin or analyst role. Rate limited to 10/minute.
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "source": "{{sourcePrincipal}}",
      "target": "{{targetPrincipal}}"
    }
